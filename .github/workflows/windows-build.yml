
name: StreamX Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore StreamX.Windows.csproj -r ${{ matrix.rid }}

      - name: Publish
        run: dotnet publish StreamX.Windows.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Windows-v0.1-${{ matrix.arch }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
